plugins {
    id 'com.android.application'
    //id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.devtools.ksp' version '2.3.11'
}

android {
    namespace 'stages.aikidoliguehdf'
    compileSdk 37

    defaultConfig {
        applicationId "stages.aikidoliguehdf"
        minSdk 23
        targetSdk 37
        versionCode 17
        versionName '1.2.12'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        signingConfig signingConfigs.debug
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        //noinspection DataBindingWithoutKapt
        dataBinding true
        buildConfig true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.databinding:databinding-runtime:9.3.2'

    implementation 'androidx.room:room-common:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    implementation 'androidx.room:room-runtime:2.8.4'
    ksp("androidx.room:room-compiler:2.8.4")
    implementation 'androidx.room:room-rxjava2:2.8.4'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.11.0"
    implementation 'javax.inject:javax.inject:1'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    // Java language implementation
    implementation("androidx.navigation:navigation-fragment-ktx:2.9.8")

    // Feature module Support
    implementation("androidx.navigation:navigation-dynamic-features-fragment:2.9.8")

    // Testing Navigation
    androidTestImplementation("androidx.navigation:navigation-testing:2.9.8")

    // Jetpack Compose Integration
    implementation("androidx.navigation:navigation-compose:2.9.8")

    implementation 'it.xabaras.android:recyclerview-swipedecorator:1.4'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
